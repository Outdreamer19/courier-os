<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Blue Mahoe Express" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bm-canopy" x1="10" y1="6" x2="54" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38B2C9"/>
