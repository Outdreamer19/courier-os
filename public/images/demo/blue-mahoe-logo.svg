  <circle cx="43" cy="25" r="11" fill="url(#bm-canopy)"/>
  <circle cx="32" cy="17" r="13" fill="url(#bm-canopy)"/>
  <circle cx="32" cy="28" r="10" fill="url(#bm-canopy)"/>
  <!-- mahoe blossoms -->
